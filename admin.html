<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HYMA ADMIN</title><!--pwa--><link rel="manifest" href="admin.webmanifest"><link rel="icon" type="image/png" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><meta name="theme-color" content="#51212F"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="HYMA ADMIN">
<style>
:root{--bg:#f6f1f2;--card:#fff;--ink:#2a1522;--mute:#6f6168;--line:#eadfe3;--brand:#7a1448;--deep:#51212F;--ok:#1e9e5a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b0f16;--card:#2a1822;--ink:#f6ebef;--mute:#bfa9b3;--line:#44283a}}
:root[data-theme="dark"]{--bg:#1b0f16;--card:#2a1822;--ink:#f6ebef;--mute:#bfa9b3;--line:#44283a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,"Segoe UI",Roboto,sans-serif}
button{font:inherit;cursor:pointer}
h1,h2,h3{font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;margin:0}
[hidden]{display:none!important}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* 0 — Connexion */
#login{min-height:100vh;display:grid;grid-template-columns:1fr 1fr;background:#fff}
.lw{position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 28px;background:linear-gradient(135deg,#fff 0%,#fdeee9 60%,#f8d9d2 100%)}
.lw img{width:150px;height:auto}
.wm{font:700 40px Georgia,serif;letter-spacing:.1em;color:var(--deep);margin-top:6px}
.wm small{display:block;font:600 14px system-ui,sans-serif;letter-spacing:.45em;color:var(--brand);margin-top:2px}
.lw h2{font-size:19px;color:#3a1a28;margin:26px 0 8px}
.lw p{max-width:340px;color:#5d4d55;margin:0}
.leaf{position:absolute;opacity:.35;fill:#e8a6a0}
.lc{display:grid;place-items:center;padding:28px;background:#fff}
.box{width:100%;max-width:380px;border:1px solid var(--line);border-radius:18px;padding:26px;background:#fff;box-shadow:0 8px 30px rgba(81,33,47,.08);color:#2a1522}
.box h1{font-size:22px;color:#2a1522;margin-bottom:18px}
.fld{display:flex;align-items:center;gap:10px;border:1.5px solid #dbe4f0;border-radius:10px;padding:0 12px;margin-bottom:14px;background:#fff}
.fld svg{color:#2a4a7f}.fld input{flex:1;min-width:0;border:0;outline:0;padding:13px 0;font:14px system-ui,sans-serif;background:transparent;color:#2a1522}
.fld:focus-within{border-color:var(--brand)}
.eye{border:0;background:none;color:#2a4a7f;padding:4px;display:flex}
.rem{display:flex;align-items:center;gap:10px;font-size:13.5px;color:#4a3b43;margin:2px 0 16px}
.rem input{width:18px;height:18px;accent-color:var(--brand)}
.go{width:100%;border:0;border-radius:10px;padding:14px;color:#fff;font-weight:700;background:linear-gradient(90deg,#51212F,#9a1f55);display:flex;align-items:center;justify-content:center;gap:10px}
.go:focus-visible,.nav button:focus-visible,.menu:focus-visible,.out:focus-visible{outline:3px solid #f0b8c8;outline-offset:2px}
.fg{display:block;text-align:center;margin-top:16px;color:var(--brand);font-size:13.5px;text-decoration:none}
.note{font-size:12px;color:#8a7b82;text-align:center;margin-top:12px;min-height:16px}
/* app shell */
#app{min-height:100vh;display:grid;grid-template-columns:230px 1fr}
.side{background:linear-gradient(180deg,#6b1034,#3b0a1f);color:#f6dfe6;padding:18px 12px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
.brand img{width:40px;height:auto}
.brand b{font:700 20px Georgia,serif;letter-spacing:.08em;color:#fff;line-height:1}.brand small{display:block;font:600 9px system-ui,sans-serif;letter-spacing:.4em;color:#e9bfcc}
.nav{display:flex;flex-direction:column;gap:3px}
.nav button{display:flex;align-items:center;gap:12px;border:0;background:none;color:#f6dfe6;text-align:left;padding:11px 12px;border-radius:10px;font-size:14px}
.nav button.on{background:#fff;color:var(--brand);font-weight:700}
.out{margin-top:auto;border:1px solid rgba(255,255,255,.25);background:none;color:#f6dfe6;border-radius:10px;padding:10px;font-size:13px}
.main{padding:22px 26px;min-width:0}
.top{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.top .t{flex:1}.top h1{font-size:21px}.top p{margin:2px 0 0;color:var(--mute);font-size:13.5px}
.date{font-size:13px;color:var(--mute);white-space:nowrap}
.menu{display:none;border:1px solid var(--line);background:var(--card);color:var(--brand);border-radius:10px;padding:8px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.st{border:1px solid;border-radius:14px;padding:14px}
.st .ic{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;margin-bottom:8px}
.st span{display:block;font-size:13px;color:#4a4a55}.st b{display:block;font:700 26px "Trebuchet MS",system-ui,sans-serif;color:#1d1a2b;margin:2px 0}.st em{font-style:normal;font-size:12px;color:var(--ok)}
.s1{background:#eaf2ff;border-color:#cfe0ff}.s1 .ic{background:#d6e6ff;color:#2f6fe5}
.s2{background:#fff3e8;border-color:#ffd9b8}.s2 .ic{background:#ffe2c6;color:#f08a3c}
.s3{background:#f3eafd;border-color:#dcc8f5}.s3 .ic{background:#e6d6fa;color:#7b3fc6}
.s4{background:#e9f9ef;border-color:#bfe9cf}.s4 .ic{background:#cdf0da;color:#1e9e5a}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);gap:14px;margin-top:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.card h3{font-size:15px;margin-bottom:12px}
.ti{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line);font-size:14px}.ti:first-of-type{border-top:0}
.ti svg{color:var(--brand)}.ti span{flex:1}
.bd{min-width:28px;text-align:center;border-radius:12px;background:#fde1e7;color:#c0264f;font-weight:700;font-size:13px;padding:2px 8px}
.leg{display:flex;gap:14px;font-size:12px;color:var(--mute);margin-bottom:6px;justify-content:flex-end}.leg i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
.ch{width:100%;height:auto;display:block}
.soon{padding:40px 16px;text-align:center;color:var(--mute)}
.demo{font-size:12px;color:var(--mute);margin-top:12px}
@media(max-width:900px){
 #login{grid-template-columns:1fr}.lw{padding:28px 20px}.lw img{width:110px}
 #app{grid-template-columns:1fr}
 .side{position:fixed;inset:0 auto 0 0;width:250px;z-index:5;transform:translateX(-105%);transition:transform .25s}
 .side.open{transform:none}
 .menu{display:flex}.main{padding:16px}
 .stats{grid-template-columns:1fr 1fr}.row2{grid-template-columns:1fr}.date{display:none}
}
@media(prefers-reduced-motion:reduce){.side{transition:none}}

.bk{border:0;background:none;color:var(--brand);font-size:22px;padding:0 4px;line-height:1}
.add{border:0;border-radius:10px;background:linear-gradient(90deg,#51212F,#9a1f55);color:#fff;font-weight:700;padding:10px 16px}
.sr{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);border-radius:10px;padding:0 12px;margin-bottom:12px;color:var(--mute)}
.sr input{flex:1;min-width:0;border:0;outline:0;padding:12px 0;background:transparent;color:var(--ink);font:14px system-ui,sans-serif}.sr:focus-within{border-color:var(--brand)}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:640px;font-size:13.5px}
th{text-align:left;font-size:12.5px;color:var(--brand);padding:10px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px 8px;border-bottom:1px solid var(--line)}tbody tr{cursor:pointer}tbody tr:hover{background:rgba(122,20,72,.05)}
.pill{display:inline-block;border-radius:8px;padding:3px 12px;font-size:12px;font-weight:700;background:#dcf7e6;color:#1e9e5a}
.pgn{display:flex;align-items:center;justify-content:flex-end;gap:6px;margin-top:14px;font-size:13px;flex-wrap:wrap}
.pgn button{min-width:28px;height:28px;border:0;border-radius:7px;background:none;color:var(--ink);padding:0 6px}.pgn .on{background:var(--brand);color:#fff}.pgn select{border:0;background:none;color:var(--mute);font:inherit;margin-left:8px}
.form{display:grid;grid-template-columns:repeat(3,1fr) auto;gap:10px;margin-bottom:14px}.form input{border:1.5px solid var(--line);border-radius:10px;padding:10px;background:var(--card);color:var(--ink);font:14px system-ui,sans-serif;min-width:0}
.pf{display:flex;gap:16px;align-items:center;flex-wrap:wrap}.av{width:68px;height:68px;border-radius:50%;background:linear-gradient(135deg,#f6c9d4,#c9577f);color:#fff;display:grid;place-items:center;font:700 22px "Trebuchet MS",sans-serif;flex:none}
.pf h2{font-size:18px}.pf p{margin:4px 0 0;display:flex;align-items:center;gap:8px;color:var(--mute);font-size:13.5px}
.pr{margin-left:auto;text-align:right;font-size:13px;color:var(--mute)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:16px 0;overflow-x:auto}
.tabs button{border:0;background:none;color:var(--mute);padding:10px 12px;font-size:13.5px;border-bottom:2px solid transparent;white-space:nowrap}.tabs .on{color:var(--brand);font-weight:700;border-color:var(--brand)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;font-size:13.5px;border-top:1px solid var(--line)}.kv:first-of-type{border-top:0}.kv span{color:var(--mute)}.kv b{font-weight:600;text-align:right}
.li{padding:11px 0;border-top:1px solid var(--line);font-size:13.5px}.li:first-of-type{border-top:0}.li span{display:block;color:var(--mute);font-size:12.5px}
@media(max-width:900px){.g2,.form,.form.f2{grid-template-columns:1fr}.pr{margin-left:0;text-align:left}}

.tb2{display:flex;gap:10px;margin-bottom:12px}.tb2 .sr{flex:1;margin:0}.tb2 select{border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);padding:0 10px;font:13.5px system-ui,sans-serif;min-width:140px}
.pill.veille{background:#fff1c2;color:#8a6a00}.form.f2{grid-template-columns:repeat(2,1fr) auto}
.pill.nouvelle{background:#fff1c2;color:#8a6a00}.pill.attente{background:#ffe0cc;color:#c2570c}.pill.transmise{background:#d6e8ff;color:#2f6fe5}.pill.rdv{background:#d9f5e3;color:#1e9e5a}.pill.terminee{background:#e4e6ee;color:#4a4f63}
.dots{border:0;background:none;color:var(--mute);font-size:20px;line-height:1;padding:0 8px}
.hd{display:flex;align-items:center;justify-content:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:6px}.hd h2{font-size:17px;flex:1}
.thumbs{display:flex;gap:10px;margin:8px 0 14px}.th{width:62px;height:62px;border-radius:10px;background:linear-gradient(135deg,#f1c7b0,#d9967a);display:grid;place-items:center;color:#7a1448}
.btn2{display:block;width:100%;border-radius:10px;padding:12px;font-weight:700;text-align:center}.btn2.o{border:1.5px solid var(--line);background:var(--card);color:var(--brand)}.btn2.p{border:0;background:linear-gradient(90deg,#51212F,#9a1f55);color:#fff}
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}.gal .th{width:100%;height:auto;aspect-ratio:1}
.msg{margin-top:10px;font-size:13px;color:var(--ok);min-height:18px}

.pill.reporte{background:#ffd9df;color:#c0264f}.pill.annule{background:#ffc9d1;color:#a8102f}
.rng{display:flex;align-items:center;gap:4px;border:1.5px solid var(--line);border-radius:10px;padding:4px 8px;background:var(--card);color:var(--ink);font-size:13px}.rng input{border:0;background:transparent;color:inherit;font:inherit;width:122px}
#act{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.tb2 .sr input[type=date]{color:var(--ink)}

.kp{border:1px solid var(--line);border-radius:14px;padding:14px;background:var(--card)}.kp span{display:block;font-size:13px;color:var(--mute)}.kp b{display:block;font:700 26px "Trebuchet MS",system-ui,sans-serif;margin:2px 0}.kp em{font-style:normal;font-size:12.5px;color:var(--ok)}
.tp{list-style:none;margin:0;padding:0}.tp li{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}.tp li:first-child{border:0}.tp span{flex:1}.tp b{font-weight:700}
.ni{display:flex;gap:14px;align-items:flex-start;padding:14px 0;border-top:1px solid var(--line);cursor:pointer}.ni:first-child{border:0}
.ni .ib{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:none}.ni .ib svg{width:22px;height:22px}
.ni b{display:block;font-size:14.5px}.ni p{margin:2px 0 0;font-size:13.5px;color:var(--mute)}.ni time{font-size:12px;color:var(--mute);white-space:nowrap;text-align:right}
.ni i.dot{display:block;width:9px;height:9px;border-radius:50%;background:#e0243f;margin:6px 0 0 auto}
.c-r{background:#fde1e7;color:#c0264f}.c-g{background:#d9f5e3;color:#1e9e5a}.c-b{background:#d6e8ff;color:#2f6fe5}.c-o{background:#ffe5cf;color:#e07a1f}
.lg2{display:flex;gap:14px;font-size:12px;color:var(--mute);margin-bottom:4px}.lg2 i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}

.rt2{display:flex;align-items:center;gap:10px;padding:7px 0;font-size:14px}.rt2 input{width:18px;height:18px;accent-color:var(--brand)}
.num{width:110px;border:1.5px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--card);color:var(--ink);text-align:right;font:14px system-ui,sans-serif}
.lnk{border:0;background:none;color:var(--brand);font-weight:600;padding:6px 0;font-size:13.5px}

.ab h2{font-size:16px;color:var(--brand);margin:18px 0 6px}.ab p{margin:0;font-size:14px;color:var(--ink)}
.abh{display:flex;align-items:center;gap:14px}.abh img{width:64px;height:auto}.abh b{display:block;font:700 28px Georgia,serif;letter-spacing:.08em;color:var(--deep)}.abh em{display:block;color:var(--brand);font-size:15px}
.vals{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:22px;text-align:center}.vals div{font-size:13.5px}.vals span{display:grid;place-items:center;width:52px;height:52px;border-radius:50%;background:#fbe8ea;color:#7a1448;margin:0 auto 6px}.vals svg{width:24px;height:24px}
.cl{display:flex;align-items:center;gap:12px;padding:8px 0;font-size:14px}.cl span{width:34px;height:34px;border-radius:50%;background:var(--deep);color:#fff;display:grid;place-items:center;flex:none}.cl svg{width:17px;height:17px}
.pics{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.ph2{aspect-ratio:16/10;border-radius:12px;background:linear-gradient(135deg,#e4eff4,#f6e3da);display:grid;place-items:center;color:#7a1448;overflow:hidden}.ph2 svg{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:1.6}.ph2 .map{width:100%;height:100%}
.cf label.f{display:block;margin-bottom:10px}.cf input,.cf textarea{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:11px;background:var(--card);color:var(--ink);font:14px system-ui,sans-serif}.cf textarea{min-height:120px;resize:vertical}.cf input:focus,.cf textarea:focus{outline:2px solid var(--brand);outline-offset:1px}
@media(max-width:900px){.vals{grid-template-columns:1fr 1fr}}
.langbar{display:flex;justify-content:flex-end;gap:4px}
.langbar button{border:1.5px solid var(--brand);background:#fff;color:var(--brand);border-radius:14px;padding:3px 11px;font:700 12px system-ui,sans-serif}
.langbar button.on{background:var(--brand);color:#fff}.langbar button:focus-visible{outline:3px solid #f0b8c8;outline-offset:2px}
#login{position:relative}.lg-abs{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:14px;z-index:3}
.sbl{justify-content:center;margin-bottom:10px}.sbl button{background:transparent;color:#f6dfe6;border-color:rgba(255,255,255,.4)}.sbl button.on{background:#fff;color:#7a1448}

.fh{display:flex;align-items:center;gap:12px;padding-bottom:12px;border-bottom:2px solid var(--brand);margin-bottom:6px}.fh img{width:50px;height:auto}.fh b{display:block;font:700 22px Georgia,serif;letter-spacing:.08em;color:var(--deep)}.fh small{color:var(--brand);font-weight:600}.fid{margin-left:auto;text-align:right;font-size:12.5px;color:var(--mute)}
.fiche h3{margin:16px 0 4px;color:var(--brand)}.fp{margin:4px 0;font-size:14px}.disc{margin:16px 0 0;font-size:12px;color:var(--mute);border-top:1px solid var(--line);padding-top:10px}
.fl{display:block;font-size:13px;color:var(--mute);margin-bottom:6px}.sel{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:11px;background:var(--card);color:var(--ink);font:14px system-ui,sans-serif}
.fb{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.fb .btn2{flex:1;min-width:140px}
@media print{body *{visibility:hidden}#fiche,#fiche *{visibility:visible}#fiche{position:absolute;left:0;top:0;width:100%;border:0}.noprint{display:none}}

/* ===== Adaptation à tous les écrans ===== */
html,body{overflow-x:clip}
#login{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.lw,.lc,.box{min-width:0}
.top{flex-wrap:wrap}.top .t{min-width:0;flex:1 1 150px}
.tb2{flex-wrap:wrap}.tb2 .sr{flex:1 1 200px;min-width:0}.tb2 select{flex:1 1 140px;min-width:0}
.rng{flex-wrap:wrap}.rng input{width:auto;min-width:0;max-width:136px}
@media (max-width:900px){
 #login{grid-template-columns:minmax(0,1fr)}
 #act{width:100%;margin-left:0}
 #act .add{flex:0 0 auto}
}
@media (max-width:480px){
 .main{padding:12px}
 .stats{grid-template-columns:1fr}
 .fb .btn2{min-width:100%}
 .form,.form.f2{grid-template-columns:1fr}
 .vals{grid-template-columns:1fr 1fr}
}
@media (min-width:1500px){.main{max-width:1400px}}

</style>

<body>
<!-- 0 Connexion Admin -->
<section id="login">
<div class="langbar lg-abs" role="group" aria-label="Langue / Language"><button type="button" data-lang="fr" aria-pressed="true">FR</button><button type="button" data-lang="en" aria-pressed="false">EN</button></div>
 <div class="lw">

 fill(CABS,cabs.map(function(c){return {_id:c.id,nom:c.nom,ville:c.ville||'—',n:dc[c.id]||0,st:ST[c.statut]||'Actif'}}));
 fill(DERM,ders.map(function(d){return {_id:d.id,_cab:d.cabinet_id,nom:d.nom,spe:d.specialite||'Dermatologie',cab:(d.cabinets&&d.cabinets.nom)||'—',ville:d.ville||'—',st:ST[d.statut]||'Actif'}}));
 var dname=function(id){var d=DERM.find(function(x){return x._id===id});return d?d.nom+' — '+d.cab:undefined};
 fill(PRE,fiches.map(function(f){var sym=(f.symptomes||[]).concat(f.symptomes_description?[f.symptomes_description]:[]).join(', ');
  return {_id:f.consultation_id,id:'#'+f.numero,nom:[f.prenom,f.nom].filter(Boolean).join(' '),pb:f.nature||'—',date:fdate(f.date_envoi),st:SM[f.statut]||'Nouvelle',age:age(f.date_naissance),sexe:SX[f.sexe]||'—',ville:f.ville||'—',app:fdate(f.date_apparition),zone:f.zone||'—',sym:sym||'—',prod:f.produits_utilises||'—',trait:f.traitements_essayes||'—',tel:f.telephone||'—',mail:f.email||'—',nb:f.nb_photos||0,der:dname(f.dermatologue_id)}}));
 fill(RD,aps.map(function(a){var c=a.consultations||{};return {_id:a.id,iso:a.date_rendez_vous||'',h:(a.heure||'').slice(0,5),nom:(c.users&&c.users.nom)||'—',der:(a.dermatologues&&a.dermatologues.nom)||'—',cab:((a.cabinets&&a.cabinets.nom)||'—').replace(/^(Cabinet|Clinique)\s+/,''),st:AS[a.statut]||'En attente'}}));
 fill(PY,pays.map(function(p){return {_id:p.id,iso:(p.paid_at||p.created_at||'').slice(0,10),nom:(p.users&&p.users.nom)||'—',srv:SV[p.service]||p.service,m:Number(p.montant)||0,mp:p.moyen==='mtn_money'?'Mobile Money':'Orange Money',st:p.statut==='paye'?'Payé':'En attente'}}));
 var cat={messages:'Messages',rappels:'Rappels',systeme:'Système'},ico={nouvelle_preconsultation:'pre',rendez_vous_confirme:'rdv',paiement_recu:'pay'};
 fill(NOT,nots.map(function(n){return {_id:n.id,cat:cat[n.categorie]||'Messages',ic:ico[n.type]||'sys',t:n.titre,d:n.message,h:ftime(n.created_at),u:n.lu?0:1}}));
 fill(PHA,phs.map(function(p){return {_id:p.id,nom:p.nom,ville:p.ville||'—',adr:p.adresse||'—',tel:p.telephone||'—',st:ST[p.statut]||'Actif'}}));
 fill(VA.data,ads.map(function(a){return {_id:a.user_id,nom:a.nom,role:RL[a.role]||a.role,mail:a.email,st:ST[a.statut]||'Actif'}}));
 VR.d='';VP.from='2000-01-01';VP.to='2100-01-01'}

/* ---------- connexion ---------- */
async function enter(){await loadAll();$('#login').hidden=true;$('#app').hidden=false;show('dash');startWatch()}
var lf=document.getElementById('lf');
lf.onsubmit=async function(e){
 e.preventDefault();var em=$('#em').value.trim(),pw=$('#pw').value;
 if(!em||!pw){note('Renseignez votre identifiant et votre mot de passe.',true);return}
 if(em.indexOf('@')<0){note('Saisissez votre adresse e-mail.',true);return}
 var btn=lf.querySelector('.go');btn.disabled=true;note('Connexion en cours…');
 try{var r=await sb.auth.signInWithPassword({email:em,password:pw});if(r.error)throw r.error;
  var a=await sb.from('admins').select('*').eq('user_id',r.data.user.id).maybeSingle();
  if(a.error)throw a.error;
  if(!a.data||a.data.statut!=='actif'){await sb.auth.signOut();throw new Error('NOADMIN')}
  await enter();
 }catch(err){note(errText(err),true)}finally{btn.disabled=false}};
note('Connexion réservée aux administrateurs.');
sb.auth.getSession().then(async function(r){if(!(r.data&&r.data.session))return;
 var a=await sb.from('admins').select('*').eq('user_id',r.data.session.user.id).maybeSingle();
 if(a.data&&a.data.statut==='actif')enter().catch(function(){})});
var oOut=document.getElementById('out').onclick;
document.getElementById('out').onclick=async function(){await sb.auth.signOut();if(timer)clearInterval(timer);oOut()};

/* ---------- tableau de bord réel ---------- */
dash=function(){
 var s=STAT||{},c=[['s1','Patients',String(s.patients||0),P.pat],['s2','Pré-consultations',String(s.preconsultations||0),P.pre],['s3','Rendez-vous',String(s.rendez_vous||0),P.rdv],['s4','Paiements',fm(s.paiements_total||0),P.pay]];
 var td=[['Nouvelles pré-consultations',s.a_traiter||0,P.pre],['Rendez-vous en attente',s.rendez_vous_en_attente||0,P.rdv],['Nouveaux partenaires',s.partenaires_en_attente||0,P.cab]];
 return '<div class="stats">'+c.map(function(x){return '<div class="st '+x[0]+'"><div class="ic">'+ic(x[3])+'</div><span>'+x[1]+'</span><b>'+x[2]+'</b></div>'}).join('')+'</div>'+
 '<div class="card" style="margin-top:14px"><h3>À traiter</h3>'+td.map(function(t){return '<div class="ti">'+ic(t[2])+'<span>'+t[0]+'</span><i class="bd" style="font-style:normal">'+t[1]+'</i></div>'}).join('')+'</div>'};

/* ---------- photos réelles dans la fiche ---------- */
async function livePhotos(p){
 if(!p||!p._id)return;
 if(!p._urls){var r=await sb.from('consultation_photos').select('storage_path').eq('consultation_id',p._id),paths=(r.data||[]).map(function(x){return x.storage_path});p._urls=[];
  if(paths.length){var s=await sb.storage.from('consultation-photos').createSignedUrls(paths,3600);p._urls=((s.data||[]).map(function(x){return x.signedUrl})).filter(Boolean)}}
 var tile=function(u){return '<span class="th"><img alt="" src="'+u+'" style="width:100%;height:100%;object-fit:cover;border-radius:10px"></span>'};
 var box=document.querySelector('.thumbs');if(box)box.innerHTML=p._urls.slice(0,3).map(tile).join('')||'<span class="demo">Aucune photo</span>';
 document.querySelectorAll('h3').forEach(function(h){if(/^Photos\b/.test(h.textContent))h.textContent='Photos ('+p._urls.length+')'});
 var vp=document.getElementById('vp');
 if(vp)vp.onclick=function(){var g=document.getElementById('gl');g.innerHTML=g.innerHTML?'':'<div class="card"><h3>Photos envoyées par le patient</h3><div class="gal">'+p._urls.map(tile).join('')+'</div></div>'}}
var _pd=preDetail;
preDetail=function(p){_pd(p);livePhotos(p);var tr=document.getElementById('tr');if(tr)tr.onclick=function(){ficheView(p)}};

/* ---------- transmission et rendez-vous ---------- */
var _fv=ficheView;
ficheView=function(p){
 _fv(p);livePhotos(p);
 var can=p.st==='Nouvelle'||p.st==='En attente',ft=document.getElementById('ft');
 var derm=function(){var sel=document.getElementById('fd2');return DERM.find(function(x){return (x.nom+' — '+x.cab)===(sel&&sel.value)})};
 if(ft&&can)ft.onclick=async function(){var d=derm();if(!d||!d._id){flash('Choisissez un dermatologue.');return}
  var r=await sb.rpc('transmettre_fiche',{p_consultation:p._id,p_dermatologue:d._id,p_note:null});
  if(r.error){flash('Transmission refusée.');return}
  p.st='Transmise';p.der=d.nom+' — '+d.cab;ficheView(p);var m=document.getElementById('fm');if(m)m.textContent='Fiche transmise à '+p.der+'.'};
 var box=document.createElement('div');box.className='card noprint';box.style.marginTop='14px';
 box.innerHTML='<h3>Rendez-vous</h3><div class="form f2" style="margin-bottom:10px"><input id="ad2" type="date" aria-label="Date du rendez-vous"><input id="ah2" type="time" aria-label="Heure"><input id="al2" placeholder="Lieu" aria-label="Lieu"><input id="ai2" placeholder="Instructions pour le patient" aria-label="Instructions pour le patient"></div><button class="btn2 p" id="as2" type="button">Confirmer le rendez-vous</button><div class="msg" id="am2" role="status"></div>';
 document.getElementById('view').appendChild(box);
 document.getElementById('as2').onclick=async function(){
  var date=document.getElementById('ad2').value,m=document.getElementById('am2');
  if(!date){m.style.color='#c0264f';m.textContent='Choisissez la date du rendez-vous.';return}
  var d=derm()||DERM.find(function(x){return p.der&&(x.nom+' — '+x.cab)===p.der});
  var row={consultation_id:p._id,dermatologue_id:d?d._id:null,cabinet_id:d?d._cab:null,date_rendez_vous:date,heure:document.getElementById('ah2').value||null,lieu:document.getElementById('al2').value.trim()||null,instructions:document.getElementById('ai2').value.trim()||null,statut:'confirme'};
  var r=await sb.from('appointments').upsert(row,{onConflict:'consultation_id'}).select().single();
  if(r.error){m.style.color='#c0264f';m.textContent='Enregistrement refusé.';return}
  p.st='Rendez-vous';m.style.color='';m.textContent='Rendez-vous confirmé. Le patient est notifié.';refresh()}};

/* ---------- listes : ajout et changement de statut enregistrés dans la base ---------- */
var TBL=function(c){return c===VD?'dermatologues':c===VC?'cabinets':c===VPH?'pharmacies':c===VA?'admins':null};
window.LIVE_TOGGLE=async function(c,d){var t=TBL(c);if(!t||!d._id)return;
 var r=await sb.from(t).update({statut:ST2[d.st]}).eq(t==='admins'?'user_id':'id',d._id);if(r.error)flash('Modification refusée.')};
window.LIVE_ADD=async function(c,it){var t=TBL(c);if(!t)return;var row;
 if(t==='admins'){c.data.splice(c.data.indexOf(it),1);lvRows(c);flash('Créez d’abord le compte dans Supabase (Authentication), puis il apparaîtra ici.');return}
 if(t==='dermatologues'){var cb=CABS.find(function(x){return x.nom===it.cab});row={nom:it.nom,specialite:'Dermatologie',cabinet_id:cb?cb._id:null,ville:it.ville==='—'?null:it.ville,statut:'actif'}}
 if(t==='cabinets')row={nom:it.nom,ville:it.ville==='—'?null:it.ville,statut:'en_attente'};
 if(t==='pharmacies')row={nom:it.nom,ville:it.ville==='—'?null:it.ville,adresse:it.adr==='—'?null:it.adr,telephone:it.tel==='—'?null:it.tel,statut:'actif'};
 var r=await sb.from(t).insert(row).select().single();
 if(r.error||!r.data){c.data.splice(c.data.indexOf(it),1);lvRows(c);flash('Ajout refusé.');return}
 it._id=r.data.id;if(t==='dermatologues')it._cab=r.data.cabinet_id};

/* ---------- notifications : marquer comme lues ---------- */
document.getElementById('view').addEventListener('click',function(e){var it=e.target.closest&&e.target.closest('.ni');if(!it)return;var n=NOT[+it.dataset.i];if(n&&n._id)sb.from('notifications').update({lu:true}).eq('id',n._id)},true);

/* ---------- actualisation (temps réel + sécurité par interrogation) ---------- */
async function refresh(){
 try{await loadAll();var a=document.activeElement,typing=a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName),form=document.querySelector('#af:not([hidden])');
  if(!typing&&!form&&['dash','pat','pre','der','cab','rdv','pay','not','pha'].indexOf(cur)>-1&&document.querySelector('#tb,#nl,.stats'))show(cur)}catch(e){}}
function startWatch(){if(watching)return;watching=true;
 try{var ch=sb.channel('hyma-admin');['consultations','payments','appointments'].forEach(function(t){ch.on('postgres_changes',{event:'*',schema:'public',table:t},function(){refresh()})});
  ch.on('postgres_changes',{event:'INSERT',schema:'public',table:'notifications'},function(p){if(p.new&&!p.new.user_id)flash(p.new.titre+' — '+p.new.message);refresh()}).subscribe()}catch(e){}
 timer=setInterval(refresh,20000)}
})();

</script>
